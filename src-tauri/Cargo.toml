[package]
name = "papyrus"
version = "0.1.0"
edition = "2021"

[lib]
name = "papyrus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
