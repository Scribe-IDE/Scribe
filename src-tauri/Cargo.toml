[package]
name = "scribe"
version = "1.1.0"
edition = "2021"

[lib]
name = "scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
trash = "5.2.9"
portable-pty = "0.9.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
similar = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# The system spell checker (same dictionaries and learned words as every other Mac app).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSRange", "NSEnumerator"] }
