name: Release

# Pushing a tag like v0.2.0 builds the installers on each system and drafts a GitHub release with
# them, the update signatures and latest.json (which the app's updater reads once the release is
# published). The notes come from that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # A wrong key fails deep inside the build; check it first and say what's wrong. A pasted
      # secret often ends in a newline, so the key is trimmed and passed on to the later steps.
      - name: Check the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          KEY=$(printf %s "$KEY" | tr -d '\n\r ')
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing or empty. Paste the whole contents of ~/.tauri/scribe.key into it."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo check > key-check.txt
          if ! out=$(npx tauri signer sign -k "$KEY" key-check.txt 2>&1); then
            echo "::error::The signing key doesn't work: $(echo "$out" | tail -2 | tr '\n' ' '). The secret must be the contents of ~/.tauri/scribe.key (not the .pub file)."
            exit 1
          fi
          rm -f key-check.txt key-check.txt.sig
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      # Signed and notarized by Apple when the six APPLE_* secrets are set (a Developer ID
      # certificate as base64 .p12, its password, the identity, the Apple ID with an app-specific
      # password, and the team). Without them the app is built as before, and macOS asks the user
      # to confirm it the first time.
      - name: Apple signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No APPLE_CERTIFICATE secret: the macOS app is not signed with a Developer ID or notarized."
            exit 0
          fi
          missing=""
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::APPLE_CERTIFICATE is set but these secrets are missing:$missing"
            exit 1
          fi
          # a pasted base64 certificate often carries line breaks
          cert=$(printf %s "$APPLE_CERTIFICATE" | tr -d '\n\r ')
          echo "::add-mask::$cert"
          {
            echo "APPLE_CERTIFICATE=$cert"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "::notice::Signing with $APPLE_SIGNING_IDENTITY and notarizing with Apple."

      - name: Notes from the changelog
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "body<<NOTES"
            awk -v v="$version" '$0 ~ "^## "v"([ (]|$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md
            echo "NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the key comes trimmed from the check above; it has no password
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Scribe ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      # When signed, check that macOS accepts the app the way a downloaded copy is checked.
      - name: Check the macOS signature
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Scribe.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type exec --verbose=2 "$app"
          xcrun stapler validate "$app"
